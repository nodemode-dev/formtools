<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>formtools</title>
  <style>
    html { height: 100%; background: transparent; }
    body { margin: 0; height: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 16px; overflow: hidden; color: #a8a8b8; font: 13px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(50vh - 64px); gap: 18px; }
    svg { display: block; }
    p { margin: 0; height: 16px; line-height: 16px; letter-spacing: 0.2px; }
    .bar { width: 180px; height: 3px; border-radius: 2px; background: #1f1f26; overflow: hidden; }
    .fill { width: 100%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #3A7BFF, #9A5CFF 30%, #FF4F7A 62%, #FFAE2B); transform-origin: 0 50%; transform: scaleX(0.04); animation: load 2.6s cubic-bezier(0.25, 0.6, 0.35, 1) forwards; }
    .fill.done { animation: none; transform: scaleX(1); transition: transform 0.2s ease-out; }
    @keyframes load { to { transform: scaleX(0.92); } }
  </style>
</head>
<body><svg width="72" height="72" role="img" aria-label="formtools" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="splash-ring" gradientUnits="userSpaceOnUse" x1="5" y1="6" x2="27" y2="27"><stop offset="0" stop-color="#3A7BFF" /><stop offset="0.35" stop-color="#9A5CFF" /><stop offset="0.68" stop-color="#FF4F7A" /><stop offset="1" stop-color="#FFAE2B" /></linearGradient></defs><rect width="32" height="32" rx="7" ry="7" fill="#0a0a0a" /><circle cx="14" cy="14" r="8.2" fill="none" stroke="url(#splash-ring)" stroke-width="2.6" /><path d="M20.2 20.2L26 26" fill="none" stroke="url(#splash-ring)" stroke-width="3.2" stroke-linecap="round" /><rect x="10.4" y="10.4" width="3" height="3" rx="0.7" fill="#f2f2f5" /><rect x="14.6" y="10.4" width="3" height="3" rx="0.7" fill="#f2f2f5" fill-opacity="0.7" /><rect x="10.4" y="14.6" width="3" height="3" rx="0.7" fill="#f2f2f5" fill-opacity="0.7" /><rect x="14.6" y="14.6" width="3" height="3" rx="0.7" fill="#f2f2f5" /></svg><p>Starting formtools</p><div class="bar" role="progressbar" aria-label="Starting formtools"><div class="fill"></div></div><script>
window.formtoolsSplashDone = function () {
  var fill = document.querySelector('.fill');
  fill.style.transform = getComputedStyle(fill).transform;
  fill.classList.add('done');
  requestAnimationFrame(function () { fill.style.transform = ''; });
};
</script></body>
</html>
