name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - name: Type check the frontend
        run: npx tsc --noEmit -p .
        working-directory: frontend
      - name: Byte-compile the engine and the setup scripts
        run: python -m compileall -q backend setup

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORMTOOLS_PORT: '8240'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python formtools_engine.py --selfcheck
      - name: Boot the engine and probe it
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port "$FORMTOOLS_PORT" &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$FORMTOOLS_PORT/api/health" && break; sleep 1; done
          curl -sf "http://127.0.0.1:$FORMTOOLS_PORT/api/health"
          curl -sf "http://127.0.0.1:$FORMTOOLS_PORT/api/capabilities"

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Shell syntax
        run: |
          for f in formtools formtools_oc_install setup/*; do
            [ -f "$f" ] || continue
            case "$f" in *.bat|*.py) continue ;; esac
            head -n 1 "$f" | grep -q 'sh' || continue
            bash -n "$f"
          done

  text-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No em dash in tracked markdown, no emoji in tracked text
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True).split():
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              markdown = path.endswith('.md')
              for ch in text:
                  cp = ord(ch)
                  if (markdown and cp == 0x2014) or 0x1F000 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF:
                      bad.append(f'{path}: U+{cp:04X}')
                      break
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
